<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Where's My Bus? - Driver</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#1f2937;
  min-height:100vh;
}

header{
  background:#087f73;
  color:white;
  text-align:center;
  padding:25px 16px;
}

header h1{
  font-size:28px;
  margin-bottom:6px;
}

header p{
  font-size:15px;
}

.container{
  width:100%;
  max-width:520px;
  margin:22px auto;
  padding:0 16px;
}

.card{
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  margin-bottom:16px;
}

.card h2{
  color:#087f73;
  margin-bottom:18px;
  font-size:22px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:16px;
  margin-bottom:14px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#087f73;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

button:hover{
  background:#09665e;
}

button.stop{
  background:#dc2626;
}

button.stop:hover{
  background:#b91c1c;
}

button.logout{
  background:#6b7280;
}

.bus-info{
  background:#ecfdf5;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}

.bus-info p{
  margin:7px 0;
}

.status{
  padding:12px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  margin-bottom:15px;
}

.status.offline{
  background:#fee2e2;
  color:#991b1b;
}

.status.online{
  background:#dcfce7;
  color:#166534;
}

.location{
  background:#f8fafc;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
  font-size:14px;
  line-height:1.7;
}

.error{
  background:#fff1f2;
  color:#be123c;
  padding:14px;
  border-radius:12px;
  margin-bottom:14px;
  line-height:1.5;
}

.success{
  background:#ecfdf5;
  color:#166534;
  padding:14px;
  border-radius:12px;
  margin-bottom:14px;
}

.hidden{
  display:none;
}

footer{
  text-align:center;
  padding:25px 10px;
  color:#6b7280;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🚌 Where's My Bus?</h1>
  <p>Driver Tracking</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginCard" class="card">

    <h2>🔐 Driver Login</h2>

    <div id="loginMessage"></div>

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter driver email"
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter password"
    >

    <button onclick="loginDriver()">
      Login
    </button>

  </div>


  <!-- DRIVER DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="card">

      <h2>🚌 Driver Dashboard</h2>

      <div id="driverInfo"></div>

      <div id="trackingStatus"
           class="status offline">
        🔴 Tracking Stopped
      </div>

      <button
        id="startButton"
        onclick="startTracking()">
        ▶️ Start Trip
      </button>

      <button
        id="stopButton"
        class="stop hidden"
        onclick="stopTracking()">
        ⏹️ Stop Trip
      </button>

      <button
        class="logout"
        onclick="logoutDriver()">
        Logout
      </button>

    </div>


    <div class="card">

      <h2>📍 GPS Location</h2>

      <div id="locationBox"
           class="location">
        Waiting for GPS location...
      </div>

    </div>

  </div>

</div>

<footer>
  Where's My Bus 🚌 | Driver Panel
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://zfbeauaerfaxarqicvgb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Q3aYd1Fp4q1lpK2Kcxgd4g_uO0Ba0e";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   VARIABLES
   ========================================================= */

let currentUser = null;
let driverRecord = null;
let assignedBus = null;

let watchId = null;
let tracking = false;


/* =========================================================
   LOGIN
   ========================================================= */

async function loginDriver(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if(!email || !password){

    message.innerHTML =
      `<div class="error">
        Please enter email and password.
      </div>`;

    return;
  }

  message.innerHTML =
    `<div class="success">
      Logging in...
    </div>`;

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){

    console.error(error);

    message.innerHTML =
      `<div class="error">
        Login failed.<br>
        ${error.message}
      </div>`;

    return;
  }

  currentUser = data.user;

  await loadDriverData();
}


/* =========================================================
   LOAD DRIVER DATA
   ========================================================= */

async function loadDriverData(){

  const { data, error } =
    await supabaseClient
      .from("drivers")
      .select("*")
      .eq("user_id", currentUser.id)
      .maybeSingle();

  if(error){

    console.error(error);

    document.getElementById("loginMessage").innerHTML =
      `<div class="error">
        Unable to load driver information.<br>
        ${error.message}
      </div>`;

    return;
  }

  if(!data){

    document.getElementById("loginMessage").innerHTML =
      `<div class="error">
        Driver account is not assigned to any bus.
      </div>`;

    return;
  }

  driverRecord = data;

  await loadAssignedBus();
}


/* =========================================================
   LOAD ASSIGNED BUS
   ========================================================= */

async function loadAssignedBus(){

  const { data, error } =
    await supabaseClient
      .from("buses")
      .select("*")
      .eq("id", driverRecord.bus_id)
      .maybeSingle();

  if(error){

    console.error(error);

    document.getElementById("loginMessage").innerHTML =
      `<div class="error">
        Unable to load assigned bus.<br>
        ${error.message}
      </div>`;

    return;
  }

  if(!data){

    document.getElementById("loginMessage").innerHTML =
      `<div class="error">
        Assigned bus was not found.
      </div>`;

    return;
  }

  assignedBus = data;

  showDashboard();
}


/* =========================================================
   SHOW DASHBOARD
   ========================================================= */

function showDashboard(){

  document
    .getElementById("loginCard")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");

  document.getElementById("driverInfo").innerHTML = `

    <div class="bus-info">

      <p>
        👤
        <strong>Driver:</strong>
        ${driverRecord.driver_name || "Driver"}
      </p>

      <p>
        🚌
        <strong>Bus Number:</strong>
        ${assignedBus.bus_number || "N/A"}
      </p>

      <p>
        🚍
        <strong>Bus Name:</strong>
        ${assignedBus.bus_name || "UPSRTC Bus"}
      </p>

      <p>
        🛣️
        <strong>Route:</strong>
        ${assignedBus.route || "Route unavailable"}
      </p>

    </div>

  `;
}


/* =========================================================
   START TRACKING
   ========================================================= */

function startTracking(){

  if(!currentUser || !assignedBus){

    alert("Driver or bus information is missing.");

    return;
  }

  if(!navigator.geolocation){

    alert(
      "GPS is not supported on this device."
    );

    return;
  }

  tracking = true;

  document
    .getElementById("startButton")
    .classList.add("hidden");

  document
    .getElementById("stopButton")
    .classList.remove("hidden");

  const status =
    document.getElementById("trackingStatus");

  status.className =
    "status online";

  status.innerHTML =
    "🟢 Live Tracking Active";

  document.getElementById("locationBox").innerHTML =
    "📡 Getting GPS location...";

  watchId =
    navigator.geolocation.watchPosition(

      function(position){

        sendLocation(position);

      },

      function(error){

        console.error(error);

        document.getElementById("locationBox").innerHTML =
          `<div class="error">
            GPS Error: ${error.message}
          </div>`;

      },

      {
        enableHighAccuracy:true,
        maximumAge:5000,
        timeout:15000
      }

    );
}


/* =========================================================
   SEND LOCATION TO SUPABASE
   ========================================================= */

async function sendLocation(position){

  if(!tracking || !assignedBus) return;

  const latitude =
    position.coords.latitude;

  const longitude =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy;

  document.getElementById("locationBox").innerHTML = `

    <strong>Latitude:</strong>
    ${latitude.toFixed(6)}<br>

    <strong>Longitude:</strong>
    ${longitude.toFixed(6)}<br>

    <strong>Accuracy:</strong>
    ${Math.round(accuracy)} metres<br>

    <strong>Updated:</strong>
    ${new Date().toLocaleTimeString()}

  `;


  const { error } =
    await supabaseClient
      .from("bus_locations")
      .insert({

        bus_id: assignedBus.id,

        latitude: latitude,

        longitude: longitude

      });


  if(error){

    console.error(
      "Location upload error:",
      error
    );

    document.getElementById("locationBox").innerHTML += `

      <div class="error">
        Location upload failed:<br>
        ${error.message}
      </div>

    `;

    return;
  }

  console.log(
    "Location uploaded:",
    latitude,
    longitude
  );
}


/* =========================================================
   STOP TRACKING
   ========================================================= */

function stopTracking(){

  tracking = false;

  if(watchId !== null){

    navigator.geolocation.clearWatch(
      watchId
    );

    watchId = null;
  }

  document
    .getElementById("startButton")
    .classList.remove("hidden");

  document
    .getElementById("stopButton")
    .classList.add("hidden");

  const status =
    document.getElementById("trackingStatus");

  status.className =
    "status offline";

  status.innerHTML =
    "🔴 Tracking Stopped";

  document.getElementById("locationBox").innerHTML =
    "GPS tracking stopped.";

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logoutDriver(){

  stopTracking();

  await supabaseClient.auth.signOut();

  currentUser = null;
  driverRecord = null;
  assignedBus = null;

  document
    .getElementById("dashboard")
    .classList.add("hidden");

  document
    .getElementById("loginCard")
    .classList.remove("hidden");

  document.getElementById("email").value = "";
  document.getElementById("password").value = "";

}


/* =========================================================
   CHECK EXISTING SESSION
   ========================================================= */

async function checkSession(){

  const { data } =
    await supabaseClient.auth.getSession();

  if(data.session){

    currentUser =
      data.session.user;

    await loadDriverData();
  }

}


checkSession();

</script>

</body>
</html>
