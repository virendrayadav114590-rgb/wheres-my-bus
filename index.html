<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Where's My Bus?</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#1f2937;
}

header{
  background:#087f73;
  color:white;
  text-align:center;
  padding:28px 16px;
}

header h1{
  font-size:32px;
  margin-bottom:8px;
}

header p{
  font-size:17px;
}

.container{
  width:100%;
  max-width:700px;
  margin:25px auto;
  padding:0 16px;
}

.search-box{
  background:white;
  padding:22px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.search-box h2{
  margin-bottom:18px;
  font-size:25px;
}

input,
select{
  width:100%;
  padding:15px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:16px;
  margin-bottom:12px;
  outline:none;
  background:white;
}

input:focus,
select:focus{
  border-color:#087f73;
  box-shadow:0 0 0 2px rgba(8,127,115,.12);
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#087f73;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#09665e;
}

.quick-search{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.quick-search button{
  background:#e6fffb;
  color:#087f73;
  font-size:15px;
  padding:13px 5px;
}

.quick-search button:hover{
  background:#ccfbf1;
}

.results{
  margin-top:20px;
}

.result-card{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-bottom:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.result-card h3{
  color:#087f73;
  margin-bottom:10px;
}

.result-card p{
  margin:7px 0;
  font-size:15px;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:7px 12px;
  border-radius:20px;
  background:#dcfce7;
  color:#166534;
  font-size:13px;
  font-weight:bold;
}

.status.inactive{
  background:#fee2e2;
  color:#991b1b;
}

.empty{
  text-align:center;
  padding:25px;
  color:#6b7280;
}

.loading{
  text-align:center;
  padding:20px;
  color:#087f73;
  font-weight:bold;
}

.error{
  background:#fff1f2;
  color:#be123c;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  line-height:1.5;
}

#map{
  width:100%;
  height:430px;
  margin-top:25px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.map-title{
  margin-top:25px;
  margin-bottom:10px;
  font-size:22px;
  color:#087f73;
  font-weight:bold;
}

.map-info{
  background:white;
  padding:15px;
  border-radius:14px;
  margin-top:12px;
  font-size:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

footer{
  text-align:center;
  padding:30px 10px;
  color:#6b7280;
  font-size:13px;
}

@media(max-width:600px){

  header h1{
    font-size:30px;
  }

  header p{
    font-size:16px;
  }

  .container{
    margin-top:20px;
  }

  .search-box{
    padding:18px;
  }

  .quick-search{
    gap:8px;
  }

  .quick-search button{
    font-size:14px;
  }

  #map{
    height:380px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🚌 Where's My Bus?</h1>
  <p>Find buses, routes and stops easily</p>
</header>

<div class="container">

  <div class="search-box">

    <h2>🔎 Search Bus</h2>

    <select id="searchType">
      <option value="bus">Bus Number</option>
      <option value="route">Route</option>
      <option value="stop">Bus Stop</option>
    </select>

    <input
      type="text"
      id="searchInput"
      placeholder="Enter bus number..."
    >

    <button onclick="searchBus()">Search</button>

    <div class="quick-search">
      <button onclick="quickSearch('bus')">🚌 Bus</button>
      <button onclick="quickSearch('route')">🛣️ Route</button>
      <button onclick="quickSearch('stop')">📍 Stop</button>
    </div>

  </div>

  <div id="results" class="results">
    <div class="empty">
      Search for a bus, route or stop
    </div>
  </div>

  <div class="map-title">
    🗺️ Live Bus Tracking
  </div>

  <div id="map"></div>

  <div class="map-info">
    📡 Live location updates are connected to Supabase.
  </div>

</div>

<footer>
  Where's My Bus 🚌 | Powered by Supabase
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

/*
   IMPORTANT:
   नीचे अपनी CURRENT working Supabase URL और
   CURRENT publishable key exactly वही रखें
   जो आपके पुराने code में है.
*/

const SUPABASE_URL = "https://zfbeauaerfaxarqicvgb.supabase.co";

const SUPABASE_KEY = "sb_publishable_Q3aYd1Fp4q1lpK2KCXgd4g_uO0Ba0bE";


const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let busMap = null;

let busMarkers = {};

let allBuses = [];

let mapReady = false;


/* =========================================================
   DOM ELEMENTS
   ========================================================= */

const searchType =
  document.getElementById("searchType");

const searchInput =
  document.getElementById("searchInput");

const results =
  document.getElementById("results");


/* =========================================================
   SEARCH PLACEHOLDER
   ========================================================= */

searchType.addEventListener("change", function(){

  const type = searchType.value;

  if(type === "bus"){
    searchInput.placeholder =
      "Enter bus number...";
  }

  if(type === "route"){
    searchInput.placeholder =
      "Enter route name...";
  }

  if(type === "stop"){
    searchInput.placeholder =
      "Enter bus stop...";
  }

});


/* =========================================================
   QUICK SEARCH
   ========================================================= */

function quickSearch(type){

  searchType.value = type;

  searchType.dispatchEvent(
    new Event("change")
  );

  searchInput.focus();

}


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showLoading(message="Searching..."){

  results.innerHTML = `
    <div class="loading">
      ⏳ ${escapeHTML(message)}
    </div>
  `;

}


function showError(error){

  console.error(error);

  const message =
    error?.message ||
    error?.details ||
    error?.hint ||
    "Unknown database error";

  results.innerHTML = `
    <div class="error">
      <strong>⚠️ Database Error</strong>
      <br><br>
      ${escapeHTML(message)}
    </div>
  `;

}


function showEmpty(message){

  results.innerHTML = `
    <div class="empty">
      ${escapeHTML(message)}
    </div>
  `;

}


/* =========================================================
   LOAD BUS DROPDOWN
   ========================================================= */

async function loadBuses(){

  const {data,error} =
    await supabaseClient
      .from("buses")
      .select("*")
      .order("bus_number");

  if(error){

    console.error(
      "Bus loading error:",
      error
    );

    return;
  }

  allBuses = data || [];

}


/* =========================================================
   BUS SEARCH
   ========================================================= */

async function searchBus(){

  const type =
    searchType.value;

  const query =
    searchInput.value.trim();

  if(!query){

    showEmpty(
      "Please enter something to search."
    );

    return;
  }

  showLoading();

  try{

    /* ==========================================
       BUS NUMBER SEARCH
       ========================================== */

    if(type === "bus"){

      const {data,error} =
        await supabaseClient
          .from("buses")
          .select("*")
          .ilike(
            "bus_number",
            `%${query}%`
          );

      if(error){
        showError(error);
        return;
      }

      if(!data || data.length === 0){

        showEmpty(
          "🚌 No bus found."
        );

        return;
      }

      renderBusResults(data);

      return;
    }


    /* ==========================================
       ROUTE SEARCH
       ========================================== */

    if(type === "route"){

      let data = null;
      let error = null;


      /*
         First try route_name
      */

      const first =
        await supabaseClient
          .from("buses")
          .select("*")
          .ilike(
            "route_name",
            `%${query}%`
          );


      if(!first.error){

        data = first.data || [];

      }else{

        /*
           If route_name does not exist,
           try route
        */

        const second =
          await supabaseClient
            .from("buses")
            .select("*")
            .ilike(
              "route",
              `%${query}%`
            );

        data = second.data;
        error = second.error;

      }


      if(error){

        showError(error);
        return;

      }


      if(!data || data.length === 0){

        showEmpty(
          "🛣️ No route found."
        );

        return;

      }


      renderRouteResults(data);

      return;
    }


    /* ==========================================
       STOP SEARCH
       ========================================== */

    if(type === "stop"){

      const stopResult =
        await supabaseClient
          .from("bus_stops")
          .select("*")
          .or(
            `stop_name.ilike.%${query}%,city.ilike.%${query}%`
          );


      if(stopResult.error){

        showError(stopResult.error);

        return;

      }


      const stops =
        stopResult.data || [];


      if(stops.length === 0){

        showEmpty(
          "📍 No bus stop found."
        );

        return;

      }


      await renderStopResults(stops);

      return;
    }

  }catch(error){

    showError(error);

  }

}


/* =========================================================
   RENDER BUS RESULTS
   ========================================================= */

function renderBusResults(data){

  results.innerHTML =
    data.map(bus => {

      const active =
        bus.is_active !== false;

      const status =
        bus.status ||
        (active ? "Active" : "Inactive");


      const route =
        bus.route_name ||
        bus.route ||
        bus.routeName ||
        "-";


      const stop =
        bus.stop ||
        bus.stop_name ||
        "-";


      const busName =
        bus.bus_name ||
        bus.name ||
        "";


      return `

        <div class="result-card">

          <h3>
            🚌 ${escapeHTML(
              bus.bus_number || "-"
            )}
          </h3>

          ${
            busName
            ? `
              <p>
                <strong>Bus Name:</strong>
                ${escapeHTML(busName)}
              </p>
            `
            : ""
          }

          <p>
            🛣️ <strong>Route:</strong>
            ${escapeHTML(route)}
          </p>

          <p>
            📍 <strong>Stop:</strong>
            ${escapeHTML(stop)}
          </p>

          <span class="status ${
            active ? "" : "inactive"
          }">
            ${escapeHTML(status)}
          </span>

        </div>

      `;

    }).join("");

}


/* =========================================================
   RENDER ROUTE RESULTS
   ========================================================= */

function renderRouteResults(data){

  results.innerHTML =
    data.map(bus => {

      const route =
        bus.route_name ||
        bus.route ||
        "-";

      return `

        <div class="result-card">

          <h3>
            🛣️ ${escapeHTML(route)}
          </h3>

          <p>
            🚌 <strong>Bus:</strong>
            ${escapeHTML(
              bus.bus_number || "-"
            )}
          </p>

          ${
            bus.bus_name
            ? `
              <p>
                <strong>Bus Name:</strong>
                ${escapeHTML(bus.bus_name)}
              </p>
            `
            : ""
          }

          <p>
            📍 <strong>Stop:</strong>
            ${escapeHTML(
              bus.stop ||
              bus.stop_name ||
              "-"
            )}
          </p>

        </div>

      `;

    }).join("");

}


/* =========================================================
   STOP RESULTS
   ========================================================= */

async function renderStopResults(stops){

  const cards =
    await Promise.all(

      stops.map(async stop => {

        let bus = null;


        if(stop.bus_id){

          const response =
            await supabaseClient
              .from("buses")
              .select("*")
              .eq(
                "id",
                stop.bus_id
              )
              .maybeSingle();

          bus =
            response.data || null;

        }


        const route =
          bus?.route_name ||
          bus?.route ||
          "-";


        const busNumber =
          bus?.bus_number ||
          stop.bus_number ||
          "-";


        const busName =
          bus?.bus_name ||
          stop.bus_name ||
          "";


        return `

          <div class="result-card">

            <h3>
              📍 ${escapeHTML(
                stop.stop_name || "-"
              )}
            </h3>

            <p>
              🏙️ <strong>City:</strong>
              ${escapeHTML(
                stop.city || "-"
              )}
            </p>

            <p>
              🚌 <strong>Bus:</strong>
              ${escapeHTML(busNumber)}
              ${
                busName
                ? " - " +
                  escapeHTML(busName)
                : ""
              }
            </p>

            <p>
              🛣️ <strong>Route:</strong>
              ${escapeHTML(route)}
            </p>

          </div>

        `;

      })

    );


  results.innerHTML =
    cards.join("");

}


/* =========================================================
   INITIALIZE MAP
   ========================================================= */

function initBusMap(){

  if(mapReady){
    return;
  }

  busMap =
    L.map("map").setView(
      [26.8467,80.9462],
      12
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(busMap);


  mapReady = true;

}


/* =========================================================
   CREATE / UPDATE BUS MARKER
   ========================================================= */

function updateBusMarker(bus){

  if(!bus){
    return;
  }


  if(
    bus.latitude === null ||
    bus.latitude === undefined ||
    bus.longitude === null ||
    bus.longitude === undefined
  ){
    return;
  }


  const lat =
    Number(bus.latitude);

  const lng =
    Number(bus.longitude);


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ){
    return;
  }


  if(!mapReady){
    initBusMap();
  }


  const busNumber =
    bus.bus_number ||
    "Bus";


  const speed =
    bus.speed_kmh ??
    bus.speed ??
    0;


  const heading =
    bus.heading ??
    "-";


  const status =
    bus.status ||
    (
      bus.is_active === false
      ? "Inactive"
      : "Active"
    );


  const popup = `

    <div>

      <strong>
        🚌 ${escapeHTML(busNumber)}
      </strong>

      <br>

      Speed:
      ${escapeHTML(speed)} km/h

      <br>

      Heading:
      ${escapeHTML(heading)}

      <br>

      Status:
      ${escapeHTML(status)}

      <br><br>

      <small>
        ${escapeHTML(
          bus.updated_at || ""
        )}
      </small>

    </div>

  `;


  if(busMarkers[busNumber]){

    busMarkers[busNumber]
      .setLatLng([lat,lng])
      .setPopupContent(popup);

  }else{

    const marker =
      L.marker([lat,lng])
        .addTo(busMap)
        .bindPopup(popup);


    busMarkers[busNumber] =
      marker;

  }

}


/* =========================================================
   LOAD CURRENT BUS LOCATIONS
   ========================================================= */

async function loadBusLocations(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("bus_locations")
        .select("*");


    if(error){

      console.error(
        "Location loading error:",
        error
      );

      return;

    }


    if(!data || data.length === 0){

      console.log(
        "No active bus locations found."
      );

      return;

    }


    for(
      const location of data
    ){

      let busInfo = null;


      if(location.bus_id){

        const response =
          await supabaseClient
            .from("buses")
            .select("*")
            .eq(
              "id",
              location.bus_id
            )
            .maybeSingle();


        busInfo =
          response.data || null;

      }


      if(busInfo){

        updateBusMarker({

          ...busInfo,

          ...location

        });

      }else{

        updateBusMarker(location);

      }

    }

  }catch(error){

    console.error(
      "Location error:",
      error
    );

  }

}


/* =========================================================
   REALTIME BUS LOCATION
   ========================================================= */

function subscribeRealtime(){

  supabaseClient

    .channel("live-bus-locations")

    .on(
      "postgres_changes",

      {
        event:"*",
        schema:"public",
        table:"bus_locations"
      },

      async payload => {

        console.log(
          "Live location update:",
          payload
        );


        /* =====================================
           DELETE
           ===================================== */

        if(
          payload.eventType === "DELETE"
        ){

          const oldLocation =
            payload.old;


          if(
            oldLocation &&
            oldLocation.bus_id
          ){

            /*
              Find marker by bus number
              through current buses table.
            */

            const response =
              await supabaseClient
                .from("buses")
                .select("bus_number")
                .eq(
                  "id",
                  oldLocation.bus_id
                )
                .maybeSingle();


            const busNumber =
              response.data?.bus_number;


            if(
              busNumber &&
              busMarkers[busNumber]
            ){

              busMap.removeLayer(
                busMarkers[busNumber]
              );


              delete
                busMarkers[busNumber];

            }

          }

          return;

        }


        /* =====================================
           INSERT / UPDATE
           ===================================== */

        const location =
          payload.new;


        if(
          !location ||
          !location.bus_id
        ){
          return;
        }


        const {
          data:busInfo,
          error
        } =
          await supabaseClient
            .from("buses")
            .select("*")
            .eq(
              "id",
              location.bus_id
            )
            .maybeSingle();


        if(error){

          console.error(
            "Realtime bus details error:",
            error
          );

          return;

        }


        if(busInfo){

          updateBusMarker({

            ...busInfo,

            ...location

          });

        }

      }

    )

    .subscribe(status => {

      console.log(
        "Realtime status:",
        status
      );

    });

}


/* =========================================================
   SEARCH BUS FROM DROPDOWN
   ========================================================= */

async function searchSelectedBus(busNumber){

  if(!busNumber){
    return;
  }


  searchType.value = "bus";

  searchInput.value = busNumber;

  await searchBus();


  /*
     Also open live location if available.
  */

  const {
    data:bus
  } =
    await supabaseClient
      .from("buses")
      .select("*")
      .eq(
        "bus_number",
        busNumber
      )
      .maybeSingle();


  if(!bus){
    return;
  }


  const {
    data:location
  } =
    await supabaseClient
      .from("bus_locations")
      .select("*")
      .eq(
        "bus_id",
        bus.id
      )
      .maybeSingle();


  if(location){

    updateBusMarker({

      ...bus,

      ...location

    });

    const lat =
      Number(location.latitude);

    const lng =
      Number(location.longitude);


    if(
      Number.isFinite(lat) &&
      Number.isFinite(lng)
    ){

      busMap.setView(
        [lat,lng],
        15
      );

    }

  }

}


/* =========================================================
   MAP REFRESH
   ========================================================= */

async function refreshMap(){

  if(!mapReady){
    initBusMap();
  }

  await loadBusLocations();

}


/* =========================================================
   START APPLICATION
   ========================================================= */

window.addEventListener(
  "load",
  async function(){

    console.log(
      "Where's My Bus starting..."
    );


    /* Initialize map */

    initBusMap();


    /* Load buses */

    await loadBuses();


    /* Load current locations */

    await loadBusLocations();


    /* Start realtime */

    subscribeRealtime();


    console.log(
      "Where's My Bus ready."
    );

  }
);

</script>

</body>
</html>
