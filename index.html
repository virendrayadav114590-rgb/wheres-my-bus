<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where's My Bus 🚌</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  background:#f4f7fb;
  color:#1f2937;
}

header{
  background:#0f766e;
  color:white;
  padding:28px 18px;
  text-align:center;
}

header h1{
  font-size:30px;
  margin-bottom:8px;
}

header p{
  font-size:16px;
}

.container{
  max-width:650px;
  margin:25px auto;
  padding:0 16px;
}

.search-box{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.search-box h2{
  margin-bottom:16px;
}

input,select{
  width:100%;
  padding:15px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:16px;
  margin-bottom:12px;
  outline:none;
}

input:focus,select:focus{
  border-color:#0f766e;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#0f766e;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#115e59;
}

.quick-search{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.quick-search button{
  background:#e6fffb;
  color:#0f766e;
  font-size:14px;
  padding:12px 5px;
}

.results{
  margin-top:20px;
}

.result-card{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-bottom:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.result-card h3{
  color:#0f766e;
  margin-bottom:8px;
}

.result-card p{
  margin:6px 0;
  font-size:15px;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:7px 10px;
  border-radius:20px;
  background:#dcfce7;
  color:#166534;
  font-size:13px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:25px;
  color:#6b7280;
}

.loading{
  text-align:center;
  padding:20px;
  color:#0f766e;
}

footer{
  text-align:center;
  padding:30px 10px;
  color:#6b7280;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🚌 Where's My Bus?</h1>
  <p>Find buses, routes and stops easily</p>
</header>

<div class="container">

  <div class="search-box">

    <h2>🔎 Search Bus</h2>

    <select id="searchType">
      <option value="bus">Bus Number</option>
      <option value="route">Route</option>
      <option value="stop">Bus Stop</option>
    </select>

    <input
      type="text"
      id="searchInput"
      placeholder="Enter bus number..."
    >

    <button onclick="searchBus()">Search</button>

    <div class="quick-search">
      <button onclick="quickSearch('bus')">🚌 Bus</button>
      <button onclick="quickSearch('route')">🛣️ Route</button>
      <button onclick="quickSearch('stop')">📍 Stop</button>
    </div>

  </div>

  <div class="results" id="results">
    <div class="empty">
      Search for a bus, route or stop
    </div>
  </div>

</div>

<footer>
  Where's My Bus 🚌 | Powered by Supabase
</footer>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE CONFIGURATION
   ========================= */

const SUPABASE_URL =
"https://zfbeauaerfaxarqicvgb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Q3aYd1Fp4q1lpK2KCXgd4g_uO0Ba0bE";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   SEARCH TYPE
   ========================= */

const searchType =
document.getElementById("searchType");

const searchInput =
document.getElementById("searchInput");


searchType.addEventListener("change",function(){

  if(this.value === "bus"){
    searchInput.placeholder =
      "Enter bus number...";
  }

  if(this.value === "route"){
    searchInput.placeholder =
      "Enter route name...";
  }

  if(this.value === "stop"){
    searchInput.placeholder =
      "Enter bus stop...";
  }

});


/* =========================
   QUICK SEARCH
   ========================= */

function quickSearch(type){

  searchType.value = type;

  searchType.dispatchEvent(
    new Event("change")
  );

  searchInput.focus();
}


/* =========================
   MAIN SEARCH
   ========================= */

async function searchBus(){

  const type =
    searchType.value;

  const query =
    searchInput.value.trim();

  const results =
    document.getElementById("results");

  if(!query){

    results.innerHTML =
      `<div class="empty">
        Please enter something to search.
      </div>`;

    return;
  }

  results.innerHTML =
    `<div class="loading">
      🔄 Searching...
    </div>`;


  /* =========================
     BUS SEARCH
     ========================= */

  if(type === "bus"){

    const {data,error} =
      await supabaseClient
      .from("buses")
      .select("*")
      .ilike("bus_number",`%${query}%`);

    if(error){

      showError(error);
      return;
    }

    if(!data || data.length === 0){

      results.innerHTML =
        `<div class="empty">
          🚌 No bus found.
        </div>`;

      return;
    }

    results.innerHTML =
      data.map(bus => `

        <div class="result-card">

          <h3>
            🚌 ${bus.bus_number || "-"}
          </h3>

          <p>
            🛣️ Route:
            ${bus.route || "-"}
          </p>

          <p>
            📍 Stop:
            ${bus.stop || "-"}
          </p>

          <span class="status">
            ● ${bus.status || "Active"}
          </span>

        </div>

      `).join("");

    return;
  }


  /* =========================
     ROUTE SEARCH
     ========================= */

  if(type === "route"){

    const {data,error} =
      await supabaseClient
      .from("bus_routes")
      .select("*")
      .or(
        `route_name.ilike.%${query}%,route_number.ilike.%${query}%,source.ilike.%${query}%,destination.ilike.%${query}%`
      );

    if(error){

      showError(error);
      return;
    }

    if(!data || data.length === 0){

      results.innerHTML =
        `<div class="empty">
          🛣️ No route found.
        </div>`;

      return;
    }

    results.innerHTML =
      data.map(route => `

        <div class="result-card">

          <h3>
            🛣️ ${route.route_name || "Route"}
          </h3>

          <p>
            📍 From:
            ${route.source || "-"}
          </p>

          <p>
            📍 To:
            ${route.destination || "-"}
          </p>

        </div>

      `).join("");

    return;
  }


  /* =========================
     STOP SEARCH
     ========================= */

  if(type === "stop"){

    const {data,error} =
      await supabaseClient
      .from("bus_stops")
      .select("*")
      .or(
  `stop_name.ilike.%${query}%,city.ilike.%${query}%`
);

    if(error){

      showError(error);
      return;
    }

    if(!data || data.length === 0){

      results.innerHTML =
        `<div class="empty">
          📍 No stop found.
        </div>`;

      return;
    }

    results.innerHTML =
      data.map(stop => `

        <div class="result-card">

          <h3>
            📍 ${stop.stop_name || "-"}
          </h3>

          <p>
            🏙️ City:
            ${stop.city || "-"}
          </p>

          <p>
            🚌 Bus ID:
            ${stop.bus_id || "-"}
          </p>

        </div>

      `).join("");

    return;
  }

}


/* =========================
   ERROR
   ========================= */

function showError(error){

  console.error(error);

  document.getElementById("results").innerHTML =

    `<div class="empty">
      ⚠️ Database error.<br><br>
      Please check Supabase table/column names.
    </div>`;
}

</script>

</body>
</html>
