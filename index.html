<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where's My Bus 🚌</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  background:#f4f7fb;
  color:#1f2937;
}

header{
  background:#0f766e;
  color:white;
  padding:28px 18px;
  text-align:center;
}

header h1{
  font-size:30px;
  margin-bottom:8px;
}

header p{
  font-size:16px;
}

.container{
  max-width:650px;
  margin:25px auto;
  padding:0 16px;
}

.search-box{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.search-box h2{
  margin-bottom:16px;
}

input,select{
  width:100%;
  padding:15px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:16px;
  margin-bottom:12px;
  outline:none;
}

input:focus,select:focus{
  border-color:#0f766e;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#0f766e;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#115e59;
}

.quick-search{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.quick-search button{
  background:#e6fffb;
  color:#0f766e;
  font-size:14px;
  padding:12px 5px;
}

.results{
  margin-top:20px;
}
#map {
    width: 100%;
    height: 400px;
    margin-top: 25px;
    border-radius: 18px;
    overflow: hidden;
}
.result-card{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-bottom:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.result-card h3{
  color:#0f766e;
  margin-bottom:8px;
}

.result-card p{
  margin:6px 0;
  font-size:15px;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:7px 10px;
  border-radius:20px;
  background:#dcfce7;
  color:#166534;
  font-size:13px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:25px;
  color:#6b7280;
}

.loading{
  text-align:center;
  padding:20px;
  color:#0f766e;
}

footer{
  text-align:center;
  padding:30px 10px;
  color:#6b7280;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🚌 Where's My Bus?</h1>
  <p>Find buses, routes and stops easily</p>
</header>

<div class="container">

  <div class="search-box">

    <h2>🔎 Search Bus</h2>

    <select id="searchType">
      <option value="bus">Bus Number</option>
      <option value="route">Route</option>
      <option value="stop">Bus Stop</option>
    </select>

    <input
      type="text"
      id="searchInput"
      placeholder="Enter bus number..."
    >

    <button onclick="searchBus()">Search</button>

    <div class="quick-search">
      <button onclick="quickSearch('bus')">🚌 Bus</button>
      <button onclick="quickSearch('route')">🛣️ Route</button>
      <button onclick="quickSearch('stop')">📍 Stop</button>
    </div>

  </div>

  <div class="results" id="results">
    <div class="empty">
      Search for a bus, route or stop
    </div>
  </div>
<div id="map"></div>
</div>

<footer>
  Where's My Bus 🚌 | Powered by Supabase
</footer>


<!-- Supabase -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE CONFIGURATION
   ========================= */

const SUPABASE_URL =
"https://zfbeauaerfaxarqicvgb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Q3aYd1Fp4q1lpK2KCXgd4g_uO0Ba0bE";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   SEARCH TYPE
   ========================= */

const searchType =
document.getElementById("searchType");

  const searchInput =
document.getElementById("searchInput");
  const busSelect = document.createElement("select");
busSelect.id = "busSelect";
busSelect.style.display = "none";

searchInput.parentNode.insertBefore(
    busSelect,
    searchInput
);
  searchInput.style.display = "none";
busSelect.style.display = "block";

async function loadBuses(){

    const { data, error } = await supabaseClient
        .from("buses")
        .select("bus_number,bus_name")
        .order("bus_number");

    if(error){
        console.error("Bus loading error:", error);
        return;
    }

    busSelect.innerHTML = "";

    data.forEach(bus => {

        const option = document.createElement("option");

        option.value = bus.bus_number;

        option.textContent =
            bus.bus_number +
            (bus.bus_name ? " - " + bus.bus_name : "");

        busSelect.appendChild(option);
    });

    if(data.length > 0){

        busSelect.value = data[0].bus_number;
        searchInput.value = data[0].bus_number;

        searchBus();
    }
}

loadBuses();

searchType.addEventListener("change", function(){

    if(this.value === "bus"){

        searchInput.style.display = "none";
        busSelect.style.display = "block";

        loadBuses();

    } else {

        searchInput.style.display = "block";
        busSelect.style.display = "none";

        if(this.value === "route"){
            searchInput.placeholder = "Enter route name...";
        }

        if(this.value === "stop"){
            searchInput.placeholder = "Enter bus stop...";
        }
    }
});



/* =========================
   QUICK SEARCH
   ========================= */

function quickSearch(type){

  searchType.value = type;

  searchType.dispatchEvent(
    new Event("change")
  );

  searchInput.focus();
}


/* =========================
   MAIN SEARCH
   ========================= */

async function searchBus(){

  const type =
    searchType.value;

  const query =
    searchInput.value.trim();

  const results =
    document.getElementById("results");

  if(!query){

    results.innerHTML =
      `<div class="empty">
        Please enter something to search.
      </div>`;

    return;
  }

  results.innerHTML =
    `<div class="loading">
      🔄 Searching...
    </div>`;


  /* =========================
     BUS SEARCH
     ========================= */

  if(type === "bus"){

    const {data,error} =
      await supabaseClient
      .from("buses")
      .select("*")
      .ilike("bus_number",`%${query}%`);

    if(error){
    results.innerHTML = `
        <div class="empty">
            <b>Supabase Error</b><br><br>
            ${error.message || "Unknown error"}<br><br>
            Code: ${error.code || "-"}<br>
            Details: ${error.details || "-"}
        </div>
    `;
    console.error(error);
    return;
    }

    if(!data || data.length === 0){

      results.innerHTML =
        `<div class="empty">
          🚌 No bus found.
        </div>`;

      return;
    }

    results.innerHTML =
      data.map(bus => `

        <div class="result-card">

          <h3>
            🚌 ${bus.bus_number || "-"}
          </h3>

          <p>
            🛣️ Route:
            ${bus.route || "-"}
          </p>

          <p>
            📍 Stop:
            ${bus.stop || "-"}
          </p>

          <span class="status">
            ● ${bus.status || "Active"}
          </span>

        </div>

      `).join("");

    return;
  }


  /* =========================
     ROUTE SEARCH
     ========================= */

  if(type === "route"){

    const {data,error} =
  await supabaseClient
  .from("buses")
  .select("*")
  .ilike("route", `%${query}%`);

    if(error){

      showError(error);
      return;
    }

    if(!data || data.length === 0){

      results.innerHTML =
        `<div class="empty">
          🛣️ No route found.
        </div>`;

      return;
    }

    results.innerHTML =
      data.map(route => `

        <div class="result-card">

          <h3>
            🛣️ ${route.route || "Route"}
          </h3>

          <p>
            📍 From:
            ${route.source || "-"}
          </p>

          <p>
            📍 To:
            ${route.destination || "-"}
          </p>

        </div>

      `).join("");

    return;
  }


  /* =========================
     STOP SEARCH
     ========================= */

  if(type === "stop"){

    const {data,error} =
      await supabaseClient
      .from("bus_stops")
      .select("*")
      .or(
  `stop_name.ilike.%${query}%,city.ilike.%${query}%`
);

    if(error){

      showError(error);
      return;
    }

    if(!data || data.length === 0){

      results.innerHTML =
        `<div class="empty">
          📍 No stop found.
        </div>`;

      return;
    }

    results.innerHTML =
  (
    await Promise.all(
      data.map(async stop => {

        const { data: bus } = await supabaseClient
          .from("buses")
          .select("bus_number,bus_name,route_name,stop")
          .eq("id", stop.bus_id)
          .maybeSingle();

        return `
          <div class="result-card">

            <h3>
              📍 ${stop.stop_name || "-"}
            </h3>

            <p>
              🏙️ City:
              ${stop.city || "-"}
            </p>

            <p>
              🚌 Bus:
              ${bus?.bus_number || stop.bus_id || "-"}
              ${bus?.bus_name ? " - " + bus.bus_name : ""}
            </p>

            <p>
              🛣️ Route:
              ${bus?.route_name || "-"}
            </p>

          </div>
        `;
      })
    )
  ).join("");
    return;
  }

}


/* =========================
   ERROR
   ========================= */

function showError(error){

  console.error(error);

  document.getElementById("results").innerHTML =

    `<div class="empty">
      ⚠️ Database error.<br><br>
      Please check Supabase table/column names.
    </div>`;
}
/* =========================
   LIVE BUS TRACKING
   ========================= */

let busMap;
let busMarkers = {};

function initBusMap() {

    busMap = L.map("map").setView([26.8467, 80.9462], 12);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(busMap);

    loadBusLocations();
}


/* Load current bus locations */

async function loadBusLocations() {

    const { data, error } = await supabaseClient
    .from("bus_locations")
    .select("*");

    if (error) {
        console.error("Location error:", error);
        return;
    }

    if (!data || data.length === 0) {
        console.log("No active buses found");
        return;
    }

    data.forEach(bus => {
        updateBusMarker(bus);
    });
}


/* Create / update bus marker */

function updateBusMarker(bus) {

    if (bus.latitude == null || bus.longitude == null) {
    return;
    }

    const lat = Number(bus.latitude);
    const lng = Number(bus.longitude);

    const popup = `
        <div>
            <strong>🚌 ${bus.bus_number || "Bus"}</strong><br>
            Speed: ${bus.speed_kmh || 0} km/h<br>
            Heading: ${bus.heading || 0}°<br>
            Status: ${bus.status || "Active"}
        </div>
    `;

    if (busMarkers[bus.bus_number]) {

        busMarkers[bus.bus_number]
            .setLatLng([lat, lng])
            .setPopupContent(popup);

    } else {

        const marker = L.marker([lat, lng])
            .addTo(busMap)
            .bindPopup(popup);

        busMarkers[bus.bus_number] = marker;
    }
}


/* =========================
   REALTIME BUS LOCATION
   ========================= */

supabaseClient
    .channel("live-bus-locations")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "bus_locations"
        },
        payload => {

            console.log("Live location update:", payload);

            if (payload.eventType === "DELETE") {

                const oldBus = payload.old;

                if (oldBus && oldBus.bus_number) {

                    if (busMarkers[oldBus.bus_number]) {

                        busMap.removeLayer(
                            busMarkers[oldBus.bus_number]
                        );

                        delete busMarkers[oldBus.bus_number];
                    }
                }

                return;
            }

            const bus = payload.new;

if (bus && bus.is_active) {
  updateBusMarker(bus);
} else if (bus && bus.bus_number) {
  if (busMarkers[bus.bus_number]) {
    busMap.removeLayer(busMarkers[bus.bus_number]);
    delete busMarkers[bus.bus_number];
  }
}
        }
    )
    .subscribe(status => {

        console.log("Realtime status:", status);

    });


/* Start map */

window.addEventListener("load", function () {

    initBusMap();

});
</script>

</body>
</html>
