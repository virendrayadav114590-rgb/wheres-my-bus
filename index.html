<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Where's My Bus?</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#1f2937;
}

header{
  background:#087f73;
  color:white;
  text-align:center;
  padding:28px 16px;
}

header h1{
  font-size:32px;
  margin-bottom:8px;
}

header p{
  font-size:17px;
}

.container{
  width:100%;
  max-width:700px;
  margin:25px auto;
  padding:0 16px;
}

.search-box{
  background:white;
  padding:22px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.search-box h2{
  margin-bottom:18px;
  font-size:25px;
}

input,
select{
  width:100%;
  padding:15px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:16px;
  margin-bottom:12px;
  outline:none;
  background:white;
}

input:focus,
select:focus{
  border-color:#087f73;
  box-shadow:0 0 0 2px rgba(8,127,115,.12);
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#087f73;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#09665e;
}

.quick-search{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.quick-search button{
  background:#e6fffb;
  color:#087f73;
  font-size:15px;
  padding:13px 5px;
}

.quick-search button:hover{
  background:#ccfbf1;
}

.results{
  margin-top:20px;
}

.result-card{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-bottom:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.result-card h3{
  color:#087f73;
  margin-bottom:10px;
}

.result-card p{
  margin:7px 0;
  font-size:15px;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:7px 12px;
  border-radius:20px;
  background:#dcfce7;
  color:#166534;
  font-size:13px;
  font-weight:bold;
}

.status.inactive{
  background:#fee2e2;
  color:#991b1b;
}

.empty{
  text-align:center;
  padding:25px;
  color:#6b7280;
}

.loading{
  text-align:center;
  padding:20px;
  color:#087f73;
  font-weight:bold;
}

.error{
  background:#fff1f2;
  color:#be123c;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  line-height:1.5;
}

#map{
  width:100%;
  height:430px;
  margin-top:25px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.map-title{
  margin-top:25px;
  margin-bottom:10px;
  font-size:22px;
  color:#087f73;
  font-weight:bold;
}

.map-info{
  background:white;
  padding:15px;
  border-radius:14px;
  margin-top:12px;
  font-size:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

footer{
  text-align:center;
  padding:30px 10px;
  color:#6b7280;
  font-size:13px;
}

@media(max-width:600px){

  header h1{
    font-size:30px;
  }

  header p{
    font-size:16px;
  }

  .container{
    margin-top:20px;
  }

  .search-box{
    padding:18px;
  }

  .quick-search{
    gap:8px;
  }

  .quick-search button{
    font-size:14px;
  }

  #map{
    height:380px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🚌 Where's My Bus?</h1>
  <p>Find buses, routes and stops easily</p>
</header>

<div class="container">

  <div class="search-box">

    <h2>🔎 Search Bus</h2>

    <select id="searchType">
      <option value="bus">Bus Number</option>
      <option value="route">Route</option>
      <option value="stop">Bus Stop</option>
    </select>

    <input
      type="text"
      id="searchInput"
      placeholder="Enter bus number..."
    >

    <button onclick="searchBus()">Search</button>

    <div class="quick-search">
      <button onclick="quickSearch('bus')">🚌 Bus</button>
      <button onclick="quickSearch('route')">🛣️ Route</button>
      <button onclick="quickSearch('stop')">📍 Stop</button>
    </div>

  </div>

  <div id="results" class="results">
    <div class="empty">
      Search for a bus, route or stop
    </div>
  </div>

  <div class="map-title">
    🗺️ Live Bus Tracking
  </div>

  <div id="map"></div>

  <div class="map-info">
    📡 Live location updates are connected to Supabase.
  </div>

</div>

<footer>
  Where's My Bus 🚌 | Powered by Supabase
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   WHERE'S MY BUS - FINAL JAVASCRIPT
   ========================================================= */

const SUPABASE_URL = "https://zfbeauaerfaxarqicvgb.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q3aYd1Fp4q1lpK2Kcxgd4g_uO0Ba0e";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let busMap = null;
let busMarkers = {};
let allBuses = [];
let mapReady = false;

/* =========================================================
   DOM ELEMENTS
   ========================================================= */

const searchType = document.getElementById("searchType");
const searchInput = document.getElementById("searchInput");
const results = document.getElementById("results");

/* =========================================================
   SEARCH PLACEHOLDER
   ========================================================= */

function updatePlaceholder() {

    if (!searchType || !searchInput) return;

    const type = searchType.value;

    if (type === "bus") {
        searchInput.placeholder = "Enter bus number...";
    }

    else if (type === "route") {
        searchInput.placeholder = "Enter route...";
    }

    else if (type === "stop") {
        searchInput.placeholder = "Enter bus stop...";
    }
}

if (searchType) {
    searchType.addEventListener("change", updatePlaceholder);
    updatePlaceholder();
}

/* =========================================================
   MAP INITIALIZATION
   ========================================================= */

function initBusMap() {

    if (busMap) return;

    const mapElement = document.getElementById("map");

    if (!mapElement) {
        console.error("Map element not found");
        return;
    }

    busMap = L.map("map").setView(
        [26.8467, 80.9462],
        12
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    ).addTo(busMap);

    mapReady = true;
}

/* =========================================================
   CLEAR MARKERS
   ========================================================= */

function clearMarkers() {

    Object.values(busMarkers).forEach(marker => {

        if (busMap && busMap.hasLayer(marker)) {
            busMap.removeLayer(marker);
        }

    });

    busMarkers = {};
}

/* =========================================================
   CREATE BUS MARKER
   ========================================================= */

function addBusMarker(bus, latitude, longitude) {

    if (!busMap || !latitude || !longitude) return;

    const lat = Number(latitude);
    const lng = Number(longitude);

    if (
        Number.isNaN(lat) ||
        Number.isNaN(lng)
    ) {
        return;
    }

    const icon = L.divIcon({
        className: "bus-marker",
        html: "🚌",
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    });

    const marker = L.marker(
        [lat, lng],
        { icon }
    ).addTo(busMap);

    marker.bindPopup(`
        <div style="font-size:15px">
            <strong>🚌 ${bus.bus_number || ""}</strong><br>
            ${bus.bus_name || ""}<br>
            ${bus.route || ""}
        </div>
    `);

    busMarkers[bus.id] = marker;
}

/* =========================================================
   LOAD BUSES
   ========================================================= */

async function loadBuses() {

    const { data, error } =
        await supabaseClient
            .from("buses")
            .select("*")
            .order("bus_number");

    if (error) {

        console.error(
            "Error loading buses:",
            error
        );

        return;
    }

    allBuses = data || [];

    console.log(
        "Buses loaded:",
        allBuses.length
    );
}

/* =========================================================
   LOAD BUS LOCATIONS
   ========================================================= */

async function loadBusLocations() {

    if (!mapReady) {
        initBusMap();
    }

    const { data, error } =
        await supabaseClient
            .from("bus_locations")
            .select("*");

    if (error) {

        console.error(
            "Error loading locations:",
            error
        );

        return;
    }

    clearMarkers();

    if (!data || data.length === 0) {
        console.log("No bus locations available");
        return;
    }

    data.forEach(location => {

        const bus =
            allBuses.find(
                b => Number(b.id) === Number(location.bus_id)
            );

        if (!bus) return;

        addBusMarker(
            bus,
            location.latitude,
            location.longitude
        );
    });

    console.log(
        "Bus locations loaded:",
        data.length
    );
}

/* =========================================================
   SHOW BUS RESULT
   ========================================================= */

function showBusResult(bus, location = null) {

    if (!results) return;

    results.innerHTML = `
        <div class="result-card">

            <h3>
                🚌 ${bus.bus_number || "Bus"}
            </h3>

            <p>
                <strong>Bus Name:</strong>
                ${bus.bus_name || "UPSRTC Bus"}
            </p>

            <p>
                🛣️
                <strong>Route:</strong>
                ${bus.route || "Route information unavailable"}
            </p>

            ${
                bus.stop_name
                ? `
                <p>
                    📍
                    <strong>Stop:</strong>
                    ${bus.stop_name}
                </p>
                `
                : ""
            }

            <span class="active-badge">
                Active
            </span>

        </div>
    `;

    if (
        location &&
        busMap &&
        location.latitude &&
        location.longitude
    ) {

        const lat = Number(location.latitude);
        const lng = Number(location.longitude);

        busMap.setView(
            [lat, lng],
            15
        );

        const marker = busMarkers[bus.id];

        if (marker) {
            marker.openPopup();
        }
    }
}

/* =========================================================
   BUS SEARCH
   ========================================================= */

async function searchBus(value) {

    const text = value.trim();

    if (!text) return;

    const { data, error } =
        await supabaseClient
            .from("buses")
            .select("*")
            .ilike("bus_number", `%${text}%`);

    if (error) {

        console.error(error);

        results.innerHTML =
            "<p>Unable to search bus.</p>";

        return;
    }

    if (!data || data.length === 0) {

        results.innerHTML =
            "<p>No bus found.</p>";

        return;
    }

    const bus = data[0];

    const { data: location } =
        await supabaseClient
            .from("bus_locations")
            .select("*")
            .eq("bus_id", bus.id)
            .order("updated_at", {
                ascending: false
            })
            .limit(1)
            .maybeSingle();

    showBusResult(
        bus,
        location
    );
}

/* =========================================================
   ROUTE SEARCH
   ========================================================= */

async function searchRoute(value) {

    const text = value.trim();

    if (!text) return;

    const { data, error } =
        await supabaseClient
            .from("buses")
            .select("*")
            .ilike("route", `%${text}%`);

    if (error) {

        console.error(error);

        results.innerHTML =
            "<p>Unable to search route.</p>";

        return;
    }

    if (!data || data.length === 0) {

        results.innerHTML =
            "<p>No route found.</p>";

        return;
    }

    results.innerHTML =
        data.map(bus => `

            <div class="result-card">

                <h3>
                    🛣️ ${bus.route || ""}
                </h3>

                <p>
                    🚌
                    <strong>Bus:</strong>
                    ${bus.bus_number || ""}
                </p>

                <p>
                    <strong>Bus Name:</strong>
                    ${bus.bus_name || ""}
                </p>

            </div>

        `).join("");
}

/* =========================================================
   STOP SEARCH
   ========================================================= */

async function searchStop(value) {

    const text = value.trim();

    if (!text) return;

    const { data, error } =
        await supabaseClient
            .from("bus_stops")
            .select("*")
            .ilike("stop_name", `%${text}%`);

    if (error) {

        console.error(error);

        results.innerHTML =
            "<p>Unable to search stop.</p>";

        return;
    }

    if (!data || data.length === 0) {

        results.innerHTML =
            "<p>No stop found.</p>";

        return;
    }

    const busIds =
        data
            .map(x => x.bus_id)
            .filter(Boolean);

    let buses = [];

    if (busIds.length > 0) {

        const response =
            await supabaseClient
                .from("buses")
                .select("*")
                .in("id", busIds);

        buses = response.data || [];
    }

    results.innerHTML =
        data.map(stop => {

            const bus =
                buses.find(
                    b => Number(b.id) === Number(stop.bus_id)
                );

            return `

                <div class="result-card">

                    <h3>
                        📍 ${stop.stop_name || ""}
                    </h3>

                    <p>
                        🏙️
                        <strong>City:</strong>
                        ${stop.city || ""}
                    </p>

                    ${
                        bus
                        ? `
                        <p>
                            🚌
                            <strong>Bus:</strong>
                            ${bus.bus_number}
                        </p>

                        <p>
                            <strong>Bus Name:</strong>
                            ${bus.bus_name || ""}
                        </p>

                        <p>
                            🛣️
                            <strong>Route:</strong>
                            ${bus.route || ""}
                        </p>
                        `
                        : ""
                    }

                </div>

            `;

        }).join("");
}

/* =========================================================
   MAIN SEARCH
   ========================================================= */

async function performSearch() {

    const type =
        searchType
        ? searchType.value
        : "bus";

    const value =
        searchInput
        ? searchInput.value
        : "";

    if (!value.trim()) {

        if (results) {
            results.innerHTML =
                "<p>Please enter a search value.</p>";
        }

        return;
    }

    if (type === "bus") {
        await searchBus(value);
    }

    else if (type === "route") {
        await searchRoute(value);
    }

    else if (type === "stop") {
        await searchStop(value);
    }
}

/* =========================================================
   SEARCH BUTTON
   ========================================================= */

const searchButton =
    document.querySelector(
        'button[type="submit"]'
    );

if (searchButton) {

    searchButton.addEventListener(
        "click",
        function(event) {

            event.preventDefault();
            performSearch();

        }
    );
}

/* =========================================================
   ENTER KEY SEARCH
   ========================================================= */

if (searchInput) {

    searchInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();
                performSearch();

            }

        }
    );
}

/* =========================================================
   QUICK SEARCH BUTTONS
   ========================================================= */

function quickSearch(type) {

    if (!searchType || !searchInput) return;

    searchType.value = type;

    updatePlaceholder();

    searchInput.focus();
}

/* =========================================================
   REALTIME LOCATION UPDATES
   ========================================================= */

function subscribeRealtime() {

    supabaseClient
        .channel("bus-location-updates")

        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "bus_locations"
            },
            async function(payload) {

                console.log(
                    "Live location update:",
                    payload
                );

                await loadBusLocations();
            }
        )

        .subscribe();

    console.log(
        "Realtime bus tracking connected."
    );
}

/* =========================================================
   PERIODIC REFRESH
   ========================================================= */

async function refreshMap() {

    if (!mapReady) {
        initBusMap();
    }

    await loadBusLocations();
}

/* Refresh every 30 seconds */

setInterval(
    refreshMap,
    30000
);

/* =========================================================
   START APPLICATION
   ========================================================= */

window.addEventListener(
    "load",
    async function() {

        console.log(
            "🚌 Where's My Bus starting..."
        );

        initBusMap();

        await loadBuses();

        await loadBusLocations();

        subscribeRealtime();

        console.log(
            "🚌 Where's My Bus ready."
        );

    }
);

</body>
</html>
